name: Extract Macros Links

on:
  push:
    paths:
      - 'gitextract.zip' # Triggers only when gitextract.zip is modified

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Run Extraction Stream
      run: |
        python -c "
        import re, zipfile, os
        pattern = re.compile(r'https?://script\.google\.com/macros/[^\s\'\"\\>]+')
        found_links = set()
        zip_path = 'gitextract.zip'
        if os.path.exists(zip_path):
            with zipfile.ZipFile(zip_path, 'r') as archive:
                for f in archive.infolist():
                    if f.filename.endswith('index.html') or f.filename.lower().endswith('/index.html'):
                        with archive.open(f) as html:
                            matches = pattern.findall(html.read().decode('utf-8', errors='ignore'))
                            found_links.update(matches)
            with open('extracted_links.txt', 'w', encoding='utf-8') as out:
                for link in sorted(found_links):
                    out.write(link + '\n')
        "

    - name: Commit and Push Results
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add extracted_links.txt
        git commit -m "Auto-updated extracted macro links from gitextract.zip" || exit 0
        git push
